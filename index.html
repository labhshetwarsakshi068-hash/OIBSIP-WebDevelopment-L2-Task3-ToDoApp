
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="todo-container">
        <header class="app-header">
            <p class="eyebrow">YOUR DAILY PLANNER</p>
            <h1>My To-Do List</h1>
            <p class="subtitle">Small steps make big progress.</p>
        </header>

        <form id="todo-form" class="todo-form">
            <input
                type="text"
                id="todo-input"
                placeholder="What do you need to do?"
                aria-label="New task"
                maxlength="150"
                required
            >
            <button type="submit" class="add-btn">+ Add Task</button>
        </form>

        <p id="message" class="message" role="status"></p>

        <section class="task-section">
            <div class="section-heading">
                <h2>Today's Tasks</h2>
                <span id="task-count" class="task-count">0 tasks</span>
            </div>

            <ul id="todo-list" class="todo-list"></ul>

            <p id="empty-state" class="empty-state">
                ✨ No tasks yet. Add your first task!
            </p>
        </section>

        <footer class="app-footer">
            <p>Stay focused. Keep moving forward. 🌱</p>
        </footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
